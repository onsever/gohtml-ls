name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            binary: gohtml-lsp-linux-amd64
          - runner: ubuntu-24.04-arm
            binary: gohtml-lsp-linux-arm64
          - runner: macos-latest
            binary: gohtml-lsp-darwin-arm64
          - runner: macos-15-large
            binary: gohtml-lsp-darwin-amd64
          - runner: windows-latest
            binary: gohtml-lsp-windows-amd64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build -o ${{ matrix.binary }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: vscode-extension/bin/
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x vscode-extension/bin/*

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: Publish to Marketplace
        run: bash scripts/publish.sh
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
