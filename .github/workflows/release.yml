name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cross-compile binaries
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -o dist/gohtml-ls-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -o dist/gohtml-ls-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -o dist/gohtml-ls-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -o dist/gohtml-ls-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -o dist/gohtml-ls-windows-amd64.exe .

      - name: Build VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          mkdir -p bin
          cp ../dist/gohtml-ls-linux-amd64 bin/gohtml-ls-linux-amd64
          cp ../dist/gohtml-ls-linux-arm64 bin/gohtml-ls-linux-arm64
          cp ../dist/gohtml-ls-darwin-amd64 bin/gohtml-ls-darwin-amd64
          cp ../dist/gohtml-ls-darwin-arm64 bin/gohtml-ls-darwin-arm64
          cp ../dist/gohtml-ls-windows-amd64.exe bin/gohtml-ls-windows-amd64.exe
          npm run esbuild
          npx vsce package --no-dependencies

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/gohtml-ls-*
            vscode-extension/*.vsix
